name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    name: Linux x86-64
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-dev libxml2-dev

      - name: Download EMVA dependencies
        run: |
          deps="$RUNNER_TEMP/iris-deps"
          mkdir -p "$deps/genapi" "$deps/gentl"
          cd "$deps" || exit 1
          curl --fail --silent --show-error --location --retry 3 --max-time 120 \
            https://www.emva.org/wp-content/uploads/GenICam_V3_5_1_public_data.zip -o genapi.zip
          curl --fail --silent --show-error --location --retry 3 --max-time 120 \
            https://www.emva.org/wp-content/uploads/GenTL_v1_6.zip -o gentl.zip
          sha256sum --check <<'CHECKSUMS'
          9ad0b97c7904efbbf37c2f65c547502cb5c369e982b1c1e4d8cce6c6d6d70858  genapi.zip
          48c0867219c4d04a968a27e740d81068fae08b6ab94c9834b221530d941bb4d1  gentl.zip
          CHECKSUMS
          for component in SDK Runtime; do
            unzip -p genapi.zip "Linux64_x64/GenApi-3.5.1-Linux64_x64-$component.tar.gz" |
              tar -xzf - -C genapi
          done
          unzip -q gentl.zip -d gentl

      - name: Build and test
        run: |
          deps="$RUNNER_TEMP/iris-deps"
          export GENICAM_ROOT="$deps/genapi"
          export LD_LIBRARY_PATH="$GENICAM_ROOT/bin/Linux64_x64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DGENTL_INCLUDE_DIR="$deps/gentl"
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure --no-tests=error
